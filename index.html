<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="wrapper">
        <div class="box1">
            <div class="text">
                <div class="getstarted"><b>Get Started</b></div>
                <div class="welcome">Welcome to Fillanta - Lets create your account</div>
            </div>
            <!-- Signup Form -->
            <div class="signup">
                <form action="">
                    <div>
                        <label for="" class="label"><b>Name</b></label>
                        <br>
                        <input type="text" class="name" placeholder="username">
                    </div>
                    <div>
                        <label for="" class="label"><b>Email</b></label>
                        <br>
                        <input type="email" name="email" id="" class="email" placeholder="xxx@gmail.com">
                    </div>
                    <div>
                        <label for="" class="label"><b>Phone number</b></label>
                        <br>
                        <input type="tel" name="tel" placeholder="xxx-xxx-xxxx" class="tel" required pattern="[9-0]{3}-[9-0]{3}[9-0]{4}">
                    </div>
                    <button class="sign"><b>Sign up</b></button>
                    <div class="last">
                        <p class="already">Already have an account?</p>
                        <p class="log"><b>Log in</b></p>
                    </div>
                
                </form>
            </div>
        </div>
        <img src="PPP2.jpg" alt="" class="pic">
    </div>
    
</body>
</html>
